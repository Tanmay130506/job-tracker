<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Tracker — Sign in</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">Job Tracker</div>
      <div class="auth-sub">Track every application in one place.</div>

      <!-- Tabs switch which form below is visible -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" type="button">Log in</button>
        <button class="auth-tab" id="tab-register" type="button">Register</button>
      </div>

      <!-- Shows errors or success messages from either form -->
      <div class="auth-message" id="auth-message"></div>

      <!-- LOGIN FORM -->
      <form class="auth-form active" id="login-form">
        <div>
          <label class="field-label" for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" required />
        </div>
        <div>
          <label class="field-label" for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-primary" id="login-submit">Log in</button>
      </form>

      <!-- REGISTER FORM -->
      <form class="auth-form" id="register-form">
        <div>
          <label class="field-label" for="register-username">Username</label>
          <input type="text" id="register-username" placeholder="janedoe" required />
        </div>
        <div>
          <label class="field-label" for="register-email">Email</label>
          <input type="email" id="register-email" placeholder="you@example.com" required />
        </div>
        <div>
          <label class="field-label" for="register-password">Password</label>
          <input type="password" id="register-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-primary" id="register-submit">Create account</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
