<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JobTrack — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/index.css"/>
</head>
<body>
  <div class="wrapper">
    <div class="brand">
      <h1>Job<span>Track</span></h1>
      <p>Your internship hunt, organised.</p>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn"        onclick="switchTab('register')">Register</button>
      </div>

      <!-- LOGIN FORM -->
      <form class="form active" id="login-form" onsubmit="handleLogin(event)">
        <div>
          <label>Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" required />
        </div>
        <div>
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required />
        </div>
        <div class="msg" id="login-msg"></div>
        <button class="btn" type="submit">Sign In</button>
      </form>

      <!-- REGISTER FORM -->
      <form class="form" id="register-form" onsubmit="handleRegister(event)">
        <div>
          <label>Username</label>
          <input type="text" id="reg-username" placeholder="tanmay" required />
        </div>
        <div>
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="you@example.com" required />
        </div>
        <div>
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="••••••••" required />
        </div>
        <div class="msg" id="register-msg"></div>
        <button class="btn" type="submit">Create Account</button>
      </form>
    </div>
  </div>

  <script src="js/index.js"></script>
</body>
</html>
